<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intraday Buy — SL/TGT Iterations</title>

<!-- 1. Icon stylesheet -->
<link rel="stylesheet" href="fonts/groww-huge-standard.css">

<!-- 2. Fonts + tokens -->
<style>
  @font-face {
    font-family: 'Sohne';
    src: url('fonts/Sohne-Kraftig.otf') format('opentype');
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: 'GrowwSans';
    src: url('fonts/GrowwSans-Regular.otf') format('opentype');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'GrowwSans';
    src: url('fonts/GrowwSans-Medium.otf') format('opentype');
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: 'GrowwHugeStandard';
    src: url('fonts/groww-huge-standard.woff2') format('woff2'),
         url('fonts/groww-huge-standard.otf') format('opentype');
    font-display: swap;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'GrowwSans', -apple-system, sans-serif;
    font-weight: 400;
    color: var(--contentPrimary);
    background: var(--backgroundPrimary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Font utility classes */
  .body-small        { font-family: 'GrowwSans', sans-serif; font-weight: 400; font-size: 12px; line-height: 18px; }
  .body-small-heavy  { font-family: 'GrowwSans', sans-serif; font-weight: 500; font-size: 12px; line-height: 18px; }
  .body-base         { font-family: 'GrowwSans', sans-serif; font-weight: 400; font-size: 14px; line-height: 20px; }
  .body-base-heavy   { font-family: 'GrowwSans', sans-serif; font-weight: 500; font-size: 14px; line-height: 20px; }
  .body-large        { font-family: 'GrowwSans', sans-serif; font-weight: 400; font-size: 16px; line-height: 24px; }
  .body-large-heavy  { font-family: 'GrowwSans', sans-serif; font-weight: 500; font-size: 16px; line-height: 24px; }
  .heading-eyebrow   { font-family: 'Sohne', sans-serif; font-weight: 500; font-size: 10px; line-height: 12px; letter-spacing: 0.2em; text-transform: uppercase; }
  .heading-xsmall    { font-family: 'Sohne', sans-serif; font-weight: 500; font-size: 14px; line-height: 20px; }
  .heading-small     { font-family: 'Sohne', sans-serif; font-weight: 500; font-size: 16px; line-height: 24px; }
  .heading-base      { font-family: 'Sohne', sans-serif; font-weight: 500; font-size: 18px; line-height: 28px; }

  .mds-iconview { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: inherit; }
  .mds-iconview .hgi { line-height: 1; color: inherit; }
  .mds-iconview--xsmall  { width: 12px; height: 12px; font-size: 12px; }
  .mds-iconview--small   { width: 16px; height: 16px; font-size: 16px; }
  .mds-iconview--medium  { width: 20px; height: 20px; font-size: 20px; }
  .mds-iconview--large   { width: 24px; height: 24px; font-size: 24px; }
  .mds-iconview--xlarge  { width: 28px; height: 28px; font-size: 28px; }

  /* Colour tokens — dark mode (Groww Invest app surface) */
  :root {
    --backgroundPrimary:        #060809;
    --backgroundSurfaceZ1:      #101314;
    --backgroundSurfaceZ2:      #1A1D1F;
    --backgroundSecondary:      #101314;
    --backgroundTertiary:       #1E2224;
    --backgroundAccent:         #04B488;
    --backgroundAccentHover:    #05C99A;
    --backgroundAccentPressed:  #039470;
    --backgroundNegative:       #ED5533;
    --backgroundNegativeHover:  #F26B4D;
    --backgroundNegativePressed:#D3441F;
    --backgroundPositive:       #04B488;
    --backgroundWarning:        #E7A71E;
    --backgroundAccentSubtle:   #0B2620;
    --backgroundNegativeSubtle: #2B1712;
    --backgroundPositiveSubtle: #0B2620;
    --backgroundWarningSubtle:  #2B2210;
    --backgroundDisabled:       #16191A;
    --backgroundTransparent:    transparent;
    --backgroundInversePrimary: #F2F5F7;
    --borderPrimary:            #252A2C;
    --borderNeutral:            #F2F5F7;
    --borderAccent:             #04B488;
    --borderNegative:           #ED5533;
    --borderWarning:            #E7A71E;
    --borderDisabled:           #1A1D1F;
    --contentPrimary:           #F2F5F7;
    --contentSecondary:         #989EA0;
    --contentTertiary:          #6E7274;
    --contentDisabled:          #4A4E50;
    --contentAccent:            #04B488;
    --contentPositive:          #04B488;
    --contentNegative:          #ED5533;
    --contentWarning:           #E7A71E;
    --contentOnColour:          #FFFFFF;
    --contentOnAccentSubtle:    #3DDBAE;
    --contentOnPositiveSubtle:  #3DDBAE;
    --contentOnNegativeSubtle:  #FF8567;
    --contentOnWarningSubtle:   #F2C464;
    --contentInversePrimary:    #101314;

    /* Emil Kowalski design-eng easing curves */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  }

  /* ============ PAGE / STAGE ============ */
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: radial-gradient(circle at 50% 0%, #14171a 0%, #060809 62%);
    padding: 48px 16px 64px;
  }

  .stage-label {
    color: var(--contentTertiary);
    text-align: center;
  }

  /* ============ SEGMENTED TAB CONTROL (outside mockup) ============ */
  .segtabs {
    position: relative;
    display: inline-flex;
    background: var(--backgroundSurfaceZ1);
    border: 1px solid var(--borderPrimary);
    border-radius: 99px;
    padding: 2px;
    gap: 4px;
    isolation: isolate;
  }
  .segtabs__indicator {
    position: absolute;
    top: 2px;
    left: 0;
    height: calc(100% - 4px);
    border-radius: 99px;
    background: var(--backgroundSurfaceZ2);
    border: 1px solid var(--borderNeutral);
    z-index: 0;
    transition: transform 260ms var(--ease-out), width 260ms var(--ease-out);
    will-change: transform, width;
  }
  .segtabs__btn {
    position: relative;
    z-index: 1;
    appearance: none;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 99px;
    color: var(--contentSecondary);
    transition: color 220ms var(--ease-out), transform 120ms var(--ease-out);
    white-space: nowrap;
  }
  .segtabs__btn:active { transform: scale(0.96); }
  .segtabs__btn[data-active="true"] { color: var(--contentPrimary); }

  /* ============ BUTTON COMPONENT (mds-btn) ============ */
  .mds-btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 8px;
    font-family: 'GrowwSans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: transform 140ms var(--ease-out), background 150ms var(--ease-out), border-color 150ms var(--ease-out), color 150ms var(--ease-out);
    white-space: nowrap;
  }
  .mds-btn:active { transform: scale(0.97); }
  .mds-btn:disabled { cursor: not-allowed; transform: none; }

  /* sizes */
  .mds-btn--large  { height: 48px; padding: 0 20px; font-size: 16px; line-height: 24px; width: 100%; }
  .mds-btn--medium { height: 40px; padding: 0 16px; font-size: 14px; line-height: 20px; }
  .mds-btn--small  { height: 32px; padding: 0 12px; font-size: 12px; line-height: 18px; }
  .mds-btn--medium.mds-btn--flex { width: 100%; }
  .mds-btn--compact.mds-btn--small  { height: 24px; padding: 0 2px; }
  .mds-btn--compact.mds-btn--medium { height: 24px; padding: 0 2px; }
  .mds-btn--compact.mds-btn--large  { height: 32px; padding: 0 4px; }

  /* variants */
  .mds-btn--primary {
    background: var(--backgroundAccent);
    color: var(--contentOnColour);
    border: none;
  }
  .mds-btn--primary:hover  { background: var(--backgroundAccentHover); }
  .mds-btn--primary:active { background: var(--backgroundAccentPressed); }
  .mds-btn--primary:disabled {
    background: var(--backgroundDisabled);
    color: var(--contentDisabled);
  }

  .mds-btn--primary-negative {
    background: var(--backgroundNegative);
    color: var(--contentOnColour);
    border: none;
  }
  .mds-btn--primary-negative:hover  { background: var(--backgroundNegativeHover); }
  .mds-btn--primary-negative:active { background: var(--backgroundNegativePressed); }
  .mds-btn--primary-negative:disabled {
    background: var(--backgroundDisabled);
    color: var(--contentDisabled);
  }

  .mds-btn--secondary {
    background: transparent;
    color: var(--contentPrimary);
    border: 1px solid var(--borderPrimary);
  }
  .mds-btn--secondary:hover  { background: var(--backgroundSurfaceZ1); }
  .mds-btn--secondary:active { background: var(--backgroundSurfaceZ2); }
  .mds-btn--secondary:disabled {
    background: var(--backgroundDisabled);
    color: var(--contentDisabled);
    border-color: var(--borderDisabled);
  }

  .mds-btn--tertiary {
    background: none;
    color: var(--contentPrimary);
    border: none;
  }
  .mds-btn--tertiary-accent {
    background: none;
    color: var(--contentAccent);
    border: none;
  }
  .mds-btn--tertiary.mds-btn--muted { color: var(--contentSecondary); }
  .mds-btn--tertiary:hover, .mds-btn--tertiary-accent:hover { opacity: 0.8; }
  .mds-btn--tertiary:disabled, .mds-btn--tertiary-accent:disabled {
    background: var(--backgroundDisabled);
    color: var(--contentDisabled);
    opacity: 1;
    border-radius: 8px;
  }

  /* ============ PILL COMPONENT (mds-pill) ============ */
  .mds-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 32px;
    flex-shrink: 0;
    border-radius: 99px;
    border: 1px solid var(--borderPrimary);
    background: transparent;
    padding: 8px 16px;
    gap: 6px;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'GrowwSans', sans-serif;
    color: var(--contentPrimary);
    transition: background 150ms var(--ease-out), border-color 150ms var(--ease-out), border-width 150ms var(--ease-out);
  }
  .mds-pill:active { transform: scale(0.97); }
  .mds-pill[data-selected="true"] {
    background: var(--backgroundTertiary);
    border-color: var(--borderNeutral);
    border-width: 2px;
    padding: 7px 15px;
    color: var(--contentPrimary);
  }

  /* ============ PHONE FRAME (360x800, minimal bezel) ============ */
  .phone {
    position: relative;
    width: 360px;
    height: 800px;
    padding: 10px;
    border-radius: 40px;
    background: linear-gradient(155deg, #4b4d4f 0%, #232527 22%, #131415 50%, #232527 78%, #57595b 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06) inset,
      0 40px 90px -20px rgba(0,0,0,0.75),
      0 10px 30px -8px rgba(0,0,0,0.6);
  }
  .phone::before {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 36px;
    border: 1px solid rgba(255,255,255,0.08);
    pointer-events: none;
  }
  .phone__buttons span {
    position: absolute;
    background: linear-gradient(180deg, #38393b, #1c1d1e);
    border-radius: 3px;
    box-shadow: -1px 0 2px rgba(0,0,0,0.4) inset;
  }
  .phone__action   { left: -3px; top: 118px; width: 3px; height: 30px; }
  .phone__vol-up   { left: -3px; top: 172px; width: 3px; height: 48px; }
  .phone__vol-down { left: -3px; top: 228px; width: 3px; height: 48px; }
  .phone__power    { right: -3px; top: 194px; width: 3px; height: 80px; }

  .phone__screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 30px;
    overflow: hidden;
    background: var(--backgroundPrimary);
    display: flex;
    flex-direction: column;
  }

  /* ============ APP SCREEN ============ */
  .app {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    background: var(--backgroundPrimary);
    overflow: hidden;
  }
  .statusbar {
    height: 40px;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 20px 8px 20px;
  }
  .statusbar .time { color: var(--contentPrimary); font-size: 15px; font-weight: 600; font-family: -apple-system, sans-serif; }
  .statusbar .icons { display: flex; align-items: center; gap: 5px; color: var(--contentPrimary); }
  .statusbar .icons svg { display: block; }

  .appbar {
    flex-shrink: 0;
    border-bottom: 1px solid var(--borderPrimary);
    display: flex;
    align-items: center;
    padding: 4px 8px;
  }
  .appbar__icon-btn {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 99px;
    color: var(--contentPrimary);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: background 160ms var(--ease-out), transform 120ms var(--ease-out);
  }
  .appbar__icon-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.06); }
  .appbar__content { flex: 1; min-width: 0; padding: 4px 4px; }
  .appbar__title { color: var(--contentPrimary); }
  .appbar__sub { color: var(--contentSecondary); margin-top: 2px; transition: color 200ms var(--ease-out); }
  .appbar__sub .chg { transition: color 200ms var(--ease-out); }
  .appbar__sub .chg.is-up { color: var(--contentPositive); }
  .appbar__sub .chg.is-down { color: var(--contentNegative); }

  .screen-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0 8px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .screen-body::-webkit-scrollbar { display: none; }

  /* product pills */
  .product-pills {
    display: flex;
    gap: 8px;
    padding: 0 16px 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .product-pills::-webkit-scrollbar { display: none; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    min-height: 48px;
  }
  .row__label { display: flex; align-items: center; gap: 4px; color: var(--contentPrimary); }
  .row__label .tag { color: var(--contentPrimary); font-weight: 500; }
  .row__label .chev { color: var(--contentSecondary); }

  .field-col { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .helper-text { color: var(--contentSecondary); text-align: right; transition: color 150ms var(--ease-out); }
  .helper-text.warning { color: var(--contentWarning); }
  .helper-text.error   { color: var(--contentNegative); }

  /* est. P&L row below SL/TGT fields */
  .est-pnl {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    padding: 0 16px;
  }
  .est-pnl__label { color: var(--contentSecondary); }
  .est-pnl__value { color: var(--contentSecondary); }
  .est-pnl__value.is-loss { color: var(--contentNegative); }
  .est-pnl__value.is-profit { color: var(--contentPositive); }
  .est-pnl__toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 12px; height: 12px; font-size: 12px;
    color: var(--contentSecondary); cursor: pointer;
    background: none; border: none; padding: 0;
    transition: color 150ms var(--ease-out);
  }
  .est-pnl__toggle:hover { color: var(--contentPrimary); }

  /* ---- oc-input-field ---- */
  .oc-input {
    display: inline-flex;
    align-items: center;
    width: 120px;
    height: 40px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--borderPrimary);
    background: transparent;
    box-sizing: border-box;
    position: relative;
    justify-content: flex-end;
    cursor: text;
    outline: none;
    transition: border-color 150ms var(--ease-out), padding 150ms var(--ease-out), background 150ms var(--ease-out);
  }
  .oc-input.is-focus,
  .oc-input.is-typing { border: 2px solid var(--borderNeutral); padding: 11px; }
  .oc-input.is-warning { border: 2px solid var(--borderWarning); padding: 11px; }
  .oc-input.is-error   { border: 2px solid var(--borderNegative); padding: 11px; }
  .oc-input.is-disabled {
    background: var(--backgroundDisabled);
    border-color: var(--borderDisabled);
    pointer-events: none;
  }
  .oc-input__value {
    font-family: 'GrowwSans', sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 24px;
    color: var(--contentPrimary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 150ms var(--ease-out);
  }
  .oc-input.is-disabled .oc-input__value { color: var(--contentDisabled); }
  .oc-input.is-empty .oc-input__value { opacity: 0; width: 0; }
  .oc-input__cursor {
    display: none;
    width: 1px;
    height: 24px;
    background: var(--contentAccent);
    animation: oc-cursor-blink 1s step-end infinite;
    margin-left: 2px;
  }
  .oc-input.is-typing .oc-input__cursor { display: inline-block; }
  @keyframes oc-cursor-blink { 50% { opacity: 0; } }

  .divider { height: 1px; background: var(--borderPrimary); width: 100%; }

  /* remover row (divider + x button) */
  .remover {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    height: 20px;
  }
  .remover .divider { flex: 1; }
  .remover__x {
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    color: var(--contentSecondary);
    background: transparent; border: none; border-radius: 99px;
    cursor: pointer;
    transition: transform 120ms var(--ease-out), color 150ms var(--ease-out);
  }
  .remover__x:active { transform: scale(0.85); }
  .remover__x:hover { color: var(--contentPrimary); }

  /* add SL/TGT trigger button (Tertiary Medium, hug content, right-aligned) */
  .add-sltgt-row {
    display: flex;
    justify-content: flex-end;
    padding: 8px 16px 4px;
  }
  .add-sltgt {
    margin: 0;
    text-decoration: underline dashed var(--contentSecondary) 1px;
    text-underline-offset: 3px;
  }

  /* expand/collapse wrapper using grid-template-rows trick */
  .expander {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 280ms var(--ease-out);
  }
  .expander.is-open { grid-template-rows: 1fr; }
  .expander__inner { overflow: hidden; min-height: 0; }

  /* ---- Iteration content sections ---- */
  .sltgt-section { display: flex; flex-direction: column; gap: 12px; padding-top: 4px; }

  /* Iteration 2: paired row */
  .paired-row {
    display: flex;
    gap: 8px;
    padding: 0 16px;
  }
  .paired-col { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .paired-col .oc-input { width: 100%; }
  .paired-label { color: var(--contentSecondary); }

  /* bottom dock */
  .dock { flex-shrink: 0; border-top: 1px solid var(--borderPrimary); }
  .dock__balance {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 0;
  }
  .dock__balance .lbl { color: var(--contentSecondary); }
  .margin-group { display: flex; align-items: center; gap: 6px; }
  .margin-group .margin-value { color: var(--contentSecondary); }
  .dock__cta-wrap { padding: 12px 16px 0; }
  .home-indicator {
    display: flex; justify-content: center; padding: 8px 0 6px;
  }
  .home-indicator span { width: 134px; height: 5px; border-radius: 99px; background: rgba(255,255,255,0.35); }

  /* ---- iteration panel swap animation ---- */
  .iteration-panel {
    display: none;
    animation: panelIn 260ms var(--ease-out);
  }
  .iteration-panel.is-active { display: block; }
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---- numpad ---- */
  .numpad {
    flex-shrink: 0;
    background: none;
  }
  .numpad__keys {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px;
  }
  .numpad__row {
    display: flex;
    gap: 8px;
  }
  .numpad__key {
    flex: 1 0 0;
    height: 56px;
    border-radius: 12px;
    border: none;
    background: none;
    color: var(--contentPrimary);
    font-family: 'Sohne', sans-serif;
    font-weight: 500;
    font-size: 24px;
    line-height: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 120ms var(--ease-out), background 150ms var(--ease-out);
  }
  .numpad__key:active { transform: scale(0.94); background: var(--backgroundSurfaceZ2); }
  .numpad__key--ghost { cursor: default; }
  .numpad__key--ghost:active { transform: none; background: none; }

</style>
</head>
<body>

<!-- Segmented tab control — OUTSIDE the mockup -->
<div class="segtabs" id="segtabs">
  <div class="segtabs__indicator" id="segtabsIndicator"></div>
  <button class="segtabs__btn heading-eyebrow" data-tab="existing" data-active="true">Existing</button>
  <button class="segtabs__btn heading-eyebrow" data-tab="paired">I1</button>
</div>

<!-- Phone frame (360x800) -->
<div class="phone">
  <div class="phone__buttons">
    <span class="phone__action"></span>
    <span class="phone__vol-up"></span>
    <span class="phone__vol-down"></span>
    <span class="phone__power"></span>
  </div>
  <div class="phone__screen">
    <div class="app">
      <!-- Status bar -->
      <div class="statusbar">
        <div class="time">12:30</div>
        <div class="icons">

            <button class="numpad__key" data-digit="8">8</button>

          <div class="numpad__row">
            <button class="numpad__key" data-digit=".">.</button>
            <button class="numpad__key" data-digit="0">0</button>

      <div class="home-indicator"><span></span></div>

  </div>

<script>
(function () {
  const DAY_OPEN = 500 / 1.0234;
  let LTP = 500;

  /* ---------- Segmented tab control (outside mockup) ---------- */
  const segtabs = document.getElementById('segtabs');
  const segIndicator = document.getElementById('segtabsIndicator');
  const segBtns = Array.from(segtabs.querySelectorAll('.segtabs__btn'));
  const panels = Array.from(document.querySelectorAll('.iteration-panel'));

  function moveSegIndicator(btn) {
    segIndicator.style.width = btn.offsetWidth + 'px';
    segIndicator.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
  }

  function setActiveTab(tab) {
    segBtns.forEach(b => {
      const active = b.dataset.tab === tab;
      b.dataset.active = active ? 'true' : 'false';
      if (active) moveSegIndicator(b);
    });
    panels.forEach(p => p.classList.toggle('is-active', p.dataset.panel === tab));
  }

  segBtns.forEach(btn => {
    btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
  });

  window.addEventListener('load', () => moveSegIndicator(segBtns[0]));
  window.addEventListener('resize', () => {
    const active = segBtns.find(b => b.dataset.active === 'true');
    if (active) moveSegIndicator(active);
  });

  /* ---------- Product pills (single-select) ---------- */
  const productPills = Array.from(document.querySelectorAll('#productPills .mds-pill'));
  productPills.forEach(pill => {
    pill.addEventListener('click', () => {
      productPills.forEach(p => p.dataset.selected = (p === pill) ? 'true' : 'false');
    });
  });

  /* ---------- Add SL/TGT reveal (per-iteration) ---------- */
  ['existing', 'paired'].forEach(key => {
    const addBtn = document.getElementById('addBtn-' + key);
    const expander = document.getElementById('expander-' + key);
    addBtn.addEventListener('click', () => {
      expander.classList.add('is-open');
      addBtn.style.display = 'none';
    });
  });

  document.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.remove;
      const expander = document.getElementById('expander-' + key);
      const addBtn = document.getElementById('addBtn-' + key);
      expander.classList.remove('is-open');
      setTimeout(() => { addBtn.style.display = ''; }, 280);
    });
  });

  /* ---------- Margin button (cycles leverage, demo interaction) ---------- */
  const leverageSteps = [5, 10, 20];
  let leverageIdx = 0;
  const marginBtn = document.getElementById('marginBtn');
  const marginValue = document.getElementById('marginValue');

  function updateMargin() {
    const leverage = leverageSteps[leverageIdx];
    marginBtn.textContent = 'Margin (' + leverage + 'x)';
    const qty = parseFloat(fieldValues.qty) || 0;
    const price = parseFloat(fieldValues.price) || 0;
    const margin = Math.round((qty * price) / leverage);
    marginValue.textContent = '₹' + margin.toLocaleString('en-IN');
  }
  marginBtn.addEventListener('click', () => {
    leverageIdx = (leverageIdx + 1) % leverageSteps.length;
    updateMargin();
  });

  /* ---------- Input focus / typing / validation ---------- */
  const fieldValues = {
    'qty': '200',
    'price': '498',
    'sl-existing': '490',
    'tgt-existing': '',
    'sl-paired': '490',
    'tgt-paired': ''
  };

  function validateAndRender(fieldKey, kind, rawVal) {
    const helper = document.querySelector('[data-helper="' + fieldKey + '"]');
    const inputEl = document.querySelector('[data-field="' + fieldKey + '"]');
    if (!inputEl) return;

    inputEl.classList.remove('is-warning', 'is-error');

    if (kind === 'price' && helper) {
      const val = parseFloat(rawVal);
      if (isNaN(val) || rawVal === '') { helper.textContent = ' '; helper.className = 'helper-text body-small'; return; }
      const diff = ((val - LTP) / LTP) * 100;
      helper.textContent = (diff >= 0 ? '+' : '') + diff.toFixed(2) + '% from market';
      helper.className = 'helper-text body-small';
    }
  }

  function fieldKind(key) {
    if (key === 'price' || key === 'qty') return key;
    if (key.startsWith('sl')) return 'sl';
    if (key.startsWith('tgt')) return 'tgt';
    return 'price';
  }

  function revalidateAll() {
    validateAndRender('price', 'price', fieldValues.price);
    validateAndRender('sl-existing', 'sl', fieldValues['sl-existing']);
    validateAndRender('tgt-existing', 'tgt', fieldValues['tgt-existing']);
    validateAndRender('sl-paired', 'sl', fieldValues['sl-paired']);
    validateAndRender('tgt-paired', 'tgt', fieldValues['tgt-paired']);
    updateAllPnl();
    updateCtaState();
  }

  function updateCtaState() {
    const anyError = Array.from(document.querySelectorAll('.oc-input.is-error')).length > 0;
    document.getElementById('ctaBuy').disabled = anyError;
  }

  /* ---------- Est. P&L below SL/TGT ---------- */
  const pnlViewMode = {};

  function updateEstPnl(fieldKey) {
    const pnlEl = document.querySelector('[data-pnl="' + fieldKey + '"]');
    if (!pnlEl) return;

    const kind = fieldKey.startsWith('sl') ? 'sl' : 'tgt';
    const inputEl = document.querySelector('[data-field="' + fieldKey + '"]');
    const val = parseFloat(fieldValues[fieldKey]);
    const qty = parseFloat(fieldValues.qty) || 0;
    const price = parseFloat(fieldValues.price) || LTP;

    const labelEl = pnlEl.querySelector('.est-pnl__label');
    const valueEl = pnlEl.querySelector('.est-pnl__value');

    if (inputEl) inputEl.classList.remove('is-warning', 'is-error');

    if (isNaN(val) || val === 0 || qty === 0) {
      labelEl.textContent = kind === 'sl' ? 'Est. loss' : 'Est. profit';
      valueEl.textContent = '--';
      valueEl.classList.remove('is-loss', 'is-profit');
      pnlEl.style.display = '';
      return;
    }

    if (kind === 'sl' && val >= LTP && inputEl) {
      labelEl.textContent = '';
      valueEl.textContent = 'Stoploss must be below LTP (₹' + LTP.toFixed(2) + ')';
      valueEl.classList.remove('is-loss', 'is-profit');
      valueEl.classList.add('is-loss');
      inputEl.classList.add('is-error');
      pnlEl.style.display = '';
      return;
    }

    if (kind === 'tgt' && val <= LTP && inputEl) {
      labelEl.textContent = '';
      valueEl.textContent = 'Target must be above LTP (₹' + LTP.toFixed(2) + ')';
      valueEl.classList.remove('is-loss', 'is-profit');
      valueEl.classList.add('is-loss');
      inputEl.classList.add('is-error');
      pnlEl.style.display = '';
      return;
    }

    const diffFromMkt = ((val - LTP) / LTP) * 100;
    if (Math.abs(diffFromMkt) < 0.5 && inputEl) {
      inputEl.classList.add('is-warning');
    }

    const diff = val - price;
    const pnlAbs = diff * qty;
    const pnlPct = price > 0 ? (diff / price) * 100 : 0;

    const mode = pnlViewMode[fieldKey] || 'pnl';

    if (mode === 'pct') {
      labelEl.textContent = '';
      const sign = diffFromMkt >= 0 ? '+' : '';
      valueEl.textContent = sign + diffFromMkt.toFixed(2) + '% from market';
      valueEl.classList.remove('is-loss', 'is-profit');
    } else {
      const isLoss = pnlAbs < 0;
      const isProfit = pnlAbs > 0;
      labelEl.textContent = isLoss ? 'Est. loss' : isProfit ? 'Est. profit' : 'Est. P&L';
      const absPnl = Math.abs(Math.round(pnlAbs));
      const formatted = absPnl.toLocaleString('en-IN');
      valueEl.textContent = (pnlAbs < 0 ? '-' : '+') + '₹' + formatted;
      valueEl.classList.remove('is-loss', 'is-profit');
      if (isLoss) valueEl.classList.add('is-loss');
      else if (isProfit) valueEl.classList.add('is-profit');
    }

    pnlEl.style.display = '';
  }

  function updateAllPnl() {
    ['sl-existing', 'tgt-existing', 'sl-paired', 'tgt-paired'].forEach(updateEstPnl);
  }

  document.addEventListener('click', function(e) {
    const toggleBtn = e.target.closest('[data-pnl-toggle]');
    if (!toggleBtn) return;
    const key = toggleBtn.getAttribute('data-pnl-toggle');
    pnlViewMode[key] = pnlViewMode[key] === 'pct' ? 'pnl' : 'pct';
    updateEstPnl(key);
  });

  /* ---------- Live market ticking ---------- */
  const ltpDisplay = document.getElementById('ltpDisplay');
  const ltpChangeEl = document.getElementById('ltpChange');

  function tickMarket() {
    const stepPct = (Math.random() - 0.5) * 0.006; // up to ±0.3%
    let next = LTP * (1 + stepPct);
    next = Math.max(500, Math.min(520, next));
    const wentUp = next >= LTP;
    LTP = next;

    ltpDisplay.textContent = LTP.toFixed(2);
    const changePct = ((LTP - DAY_OPEN) / DAY_OPEN) * 100;
    ltpChangeEl.textContent = '(' + (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '%)';
    ltpChangeEl.classList.toggle('is-up', changePct >= 0);
    ltpChangeEl.classList.toggle('is-down', changePct < 0);

    revalidateAll();
    updateMargin();
  }
  setInterval(tickMarket, 1500);

  /* ---------- Numpad ---------- */
  const numpad = document.getElementById('numpad');
  let activeField = null;

  function currentValue(key) {
    return fieldValues[key] || '';
  }

  function setValue(key, val) {
    fieldValues[key] = val;
    const field = document.querySelector('[data-field="' + key + '"]');
    const valueSpan = field.querySelector('.oc-input__value');
    valueSpan.textContent = val;
    field.classList.toggle('is-empty', !val);
    validateAndRender(key, fieldKind(key), val);
    updateAllPnl();
    updateCtaState();
    if (key === 'qty' || key === 'price') updateMargin();
  }

  function openNumpad(key) {
    document.querySelectorAll('.oc-input.is-focus, .oc-input.is-typing').forEach(el => {
      el.classList.remove('is-focus', 'is-typing');
    });
    activeField = key;
    const field = document.querySelector('[data-field="' + key + '"]');
    if (field) field.classList.add('is-focus', 'is-typing');
  }

  function closeNumpad() {
    if (activeField) {
      const field = document.querySelector('[data-field="' + activeField + '"]');
      if (field) field.classList.remove('is-focus', 'is-typing');
    }
    activeField = null;
  }

  document.querySelectorAll('.numpad__key[data-digit]').forEach(key => {
    key.addEventListener('click', () => {
      if (!activeField) return;
      const digit = key.dataset.digit;
      let current = currentValue(activeField);
      if (digit === '.' && current.includes('.')) return;
      if (current.length < 6) current += digit;
      setValue(activeField, current);
    });
  });

  document.getElementById('numpadBackspace').addEventListener('click', () => {
    if (!activeField) return;
    const current = currentValue(activeField).slice(0, -1);
    setValue(activeField, current);
  });

  document.querySelectorAll('.oc-input[data-field]').forEach(field => {
    const key = field.dataset.field;

    field.addEventListener('click', () => {
      openNumpad(key);
    });

    field.addEventListener('keydown', (e) => {
      let current = currentValue(key);
      if (/^[0-9]$/.test(e.key) && current.length < 6) {
        current += e.key;
      } else if (e.key === 'Backspace') {
        current = current.slice(0, -1);
      } else if (e.key === 'Tab') {
        return;
      } else if (e.key === 'Enter' || e.key === 'Escape') {
        e.preventDefault();
        closeNumpad();
        field.blur();
        return;
      } else {
        e.preventDefault();
        return;
      }
      e.preventDefault();
      setValue(key, current);
    });
  });

  /* initial validation + margin pass */
  revalidateAll();
  updateMargin();
  openNumpad('price');
})();
</script>
